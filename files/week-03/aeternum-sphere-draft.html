<!DOCTYPE html>
<meta charset="utf-8">
<title>Aeternum Agenda / 256</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#111; --dim:#8b8880; --line:#d8d5cd; --bg:#fff;
         --serif:"EB Garamond",Garamond,serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--serif)}
  body{cursor:grab} body.dragging{cursor:grabbing}
  button{font:inherit;background:none;border:0;cursor:pointer;color:inherit}

  /* ---------------------------------------------------------------- sphere */
  #stage{position:fixed;inset:0;perspective:1600px}
  #dolly{position:absolute;inset:0;transform-style:preserve-3d}
  #sphere{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}

  .tile{position:absolute;left:0;top:0;width:126px;height:92px;margin:-46px -63px;
        transform-style:preserve-3d}
  /* Two faces per tile. With a single face you only ever see the near
     hemisphere; the far side either vanishes or renders mirrored. */
  .face{position:absolute;inset:0;backface-visibility:hidden;
        border:1px solid var(--line);background:#fafaf8;overflow:hidden;
        display:flex;align-items:center;justify-content:center;
        transition:opacity .4s ease,border-color .18s ease}
  .face.back{transform:rotateY(180deg);opacity:.30}
  .face img{max-width:100%;max-height:100%;display:block;
            filter:grayscale(1) contrast(1.06);opacity:0;transition:opacity .7s ease}
  .face img.in{opacity:1}
  .face.back img{filter:grayscale(1) contrast(.92) brightness(1.12)}
  .tile:hover .face{border-color:var(--ink)}
  .tile.muted .face{opacity:.06}
  .n{position:absolute;left:3px;bottom:2px;font-size:8px;letter-spacing:.1em;color:var(--dim)}

  /* ---------------------------------------------------------------- camera */
  #eye{position:fixed;left:50%;top:50%;width:184px;height:184px;margin:-92px;
       border-radius:50%;overflow:hidden;z-index:6;pointer-events:none;background:#fff;
       box-shadow:0 0 0 1px var(--line),0 0 0 9px rgba(255,255,255,.85),0 0 0 10px var(--line)}
  #eye video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);
             filter:grayscale(1) contrast(1.1);opacity:.9}
  #eye canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
  #eyeLabel{position:fixed;left:50%;top:50%;margin:108px 0 0 -120px;width:240px;text-align:center;
            font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
            z-index:6;pointer-events:none}

  /* ---------------------------------------------------------------- chrome */
  header{position:fixed;top:0;left:0;right:0;padding:18px 22px;z-index:8;
         display:flex;align-items:baseline;gap:16px;pointer-events:none}
  h1{font-size:13px;font-weight:500;letter-spacing:.34em;text-transform:uppercase}
  header .sub{font-size:11px;color:var(--dim);letter-spacing:.14em}

  #chapters{position:fixed;left:22px;top:64px;z-index:8;display:flex;flex-direction:column}
  #chapters button{border-left:1px solid var(--line);padding:5px 0 5px 10px;font-size:10.5px;
        letter-spacing:.12em;color:var(--dim);text-align:left;max-width:220px;
        transition:color .2s,border-color .2s}
  #chapters button:hover{color:var(--ink)}
  #chapters button[aria-pressed=true]{color:var(--ink);border-left-color:var(--ink)}
  #chapters .ct{color:#c3c0b8;margin-left:6px}

  #hud{position:fixed;right:22px;top:64px;z-index:8;text-align:right;font-size:10.5px;
       letter-spacing:.12em;color:var(--dim);line-height:2}
  #hud b{color:var(--ink);font-weight:400}
  #hud button{font-size:10.5px;letter-spacing:.12em;color:var(--dim)}
  #hud button:hover,#hud .on{color:var(--ink)}

  footer{position:fixed;right:22px;bottom:22px;z-index:8;font-size:10px;letter-spacing:.12em;
         color:#b6b3ab;text-align:right;line-height:1.9}

  /* ---------------------------------------------------------------- plate view */
  #plate{position:fixed;inset:0;z-index:20;background:var(--bg);opacity:0;
         pointer-events:none;transition:opacity .34s ease}
  #plate.on{opacity:1;pointer-events:auto}
  #plate .shot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
               max-width:78vw;max-height:76vh;filter:grayscale(1) contrast(1.05);opacity:.4}
  #plate svg.arcs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #plate .rules{position:absolute;inset:0;pointer-events:none}
  #plate .rules i{position:absolute;left:0;right:0;height:1px;background:var(--line)}
  #plate .type{position:absolute;inset:0;display:flex;flex-direction:column;
               align-items:center;justify-content:center;padding:0 3vw;pointer-events:none}
  #plate .type div{font-size:inherit;line-height:.97;letter-spacing:.015em;
                   text-transform:uppercase;text-align:center;white-space:nowrap}
  #plate .corner{position:absolute;bottom:20px;font-size:12px;letter-spacing:.12em}
  #plate .corner.l{left:22px} #plate .corner.r{right:22px}
  #plate .top{position:absolute;top:20px;font-size:10px;letter-spacing:.2em;
              text-transform:uppercase;color:var(--dim)}
  #plate .top.l{left:22px} #plate .top.r{right:22px}
  #plate .top.r a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
  #plate .top.r a:hover{color:var(--ink)}
  #plate .nav{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
              font-size:10px;letter-spacing:.16em;color:var(--dim)}
  #plate .nav button{font-size:10px;letter-spacing:.16em;color:var(--dim);padding:0 10px}
  #plate .nav button:hover{color:var(--ink)}
</style>

/* ---------------------------------------------------------------- thumbnails
   The manifest points at full-resolution originals; 256 of those is hundreds of
   megabytes. Rewrite to a thumbnail where the host offers one, fall back to the
   original if that 404s. */
function thumb(url, px) {
  px = px || 480;
  if (url.indexOf('upload.wikimedia.org') > -1) {
    if (url.indexOf('/thumb/') > -1) return url.replace(/\/\d+px-/, '/' + px + 'px-');
    var m = url.match(/^(https:\/\/upload\.wikimedia\.org\/wikipedia\/[^\/]+)\/([0-9a-f])\/([0-9a-f]{2})\/([^?]+)/);
    if (m) return m[1] + '/thumb/' + m[2] + '/' + m[3] + '/' + m[4] + '/' + px + 'px-' + m[4];
  }
  if (url.indexOf('iiif.wellcomecollection.org') > -1)
    return url.replace(/\/full\/[^\/]+\//, '/full/' + px + '%2C/');
  return url;
}

/* ---------------------------------------------------------------- build */
var R = 1200, N = PLATES.length, GOLDEN = 137.5077640500378;
var sphere = document.getElementById('sphere');
var tiles = [];

PLATES.forEach(function (p, i) {
  var y   = 1 - (i / (N - 1)) * 2;
  var lat = Math.asin(y) * 180 / Math.PI;
  var lon = (i * GOLDEN) % 360;

  var el = document.createElement('div');
  el.className = 'tile';
  el.style.transform = 'rotateY(' + lon + 'deg) rotateX(' + lat + 'deg) translateZ(' + R + 'px)';
  el.dataset.i = i;

  var num = '<span class="n">' + String(p[0]).padStart(3, '0') + '</span>';
  el.innerHTML = '<div class="face front">' + num + '</div><div class="face back">' + num + '</div>';
  sphere.appendChild(el);
  tiles.push({ el: el, p: p, front: el.firstChild, back: el.lastChild });
});

var loaded = 0, counter = document.getElementById('loaded');
function loadWave(start, size) {
  for (var i = start; i < Math.min(start + size, N); i++) (function (t) {
    var img = new Image();
    img.decoding = 'async';
    img.onload = function () {
      img.classList.add('in');
      var clone = img.cloneNode();          // the second face needs its own node
      clone.classList.add('in');
      t.back.appendChild(clone);
      loaded++; counter.textContent = loaded;
    };
    img.onerror = function () {
      if (img.src !== t.p[3]) img.src = t.p[3];
      else t.front.style.borderColor = '#e0c9c9';
    };
    img.src = thumb(t.p[3]);
    t.front.appendChild(img);
  })(tiles[i]);
  if (start + size < N) setTimeout(function () { loadWave(start + size, size); }, 240);
}
loadWave(0, 24);

/* ---------------------------------------------------------------- rig */
var rotX = -6, rotY = 0, zoom = -560;
var velX = 0, velY = 0.05, spinning = true;
var dragging = false, lastX = 0, lastY = 0, moved = 0;
var handX = null, handY = null, handZoom = null;

var dolly = document.getElementById('dolly');
function frame() {
  if (handX !== null) {
    velY += (handX * 2.6 - velY) * 0.12;       // hand steers, centre is neutral
    velX += (handY * 2.0 - velX) * 0.12;
    if (handZoom !== null) zoom += (handZoom - zoom) * 0.08;
  } else if (!dragging) {
    velX *= 0.94;
    velY = spinning ? velY * 0.94 + 0.003 : velY * 0.94;
  }
  if (!dragging) { rotX += velX; rotY += velY; }
  rotX = Math.max(-88, Math.min(88, rotX));
  dolly.style.transform = 'translateZ(' + zoom + 'px) rotateX(' + rotX + 'deg) rotateY(' + rotY + 'deg)';
  requestAnimationFrame(frame);
}
frame();

addEventListener('pointerdown', function (e) {
  if (e.target.closest('#chapters,#hud,#plate,footer')) return;
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  document.body.classList.add('dragging');
});
addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  rotY += dx * .22; rotX -= dy * .22; velY = dx * .22; velX = -dy * .22;
});
addEventListener('pointerup', function () {
  dragging = false; document.body.classList.remove('dragging');
});
addEventListener('wheel', function (e) {
  e.preventDefault();
  zoom = Math.max(-2100, Math.min(900, zoom - e.deltaY * 1.1));
}, { passive: false });

/* ---------------------------------------------------------------- hand control
   MediaPipe Hands. getUserMedia needs a secure context, so this works from
   http://localhost but not from a file:// path. The readout says which. */
var vid = document.getElementById('vid');
var hcv = document.getElementById('hand');
var hctx = hcv.getContext('2d');
var state = document.getElementById('handState');
var camBtn = document.getElementById('camBtn');
var camOn = false;

function loadScript(src) {
  return new Promise(function (res, rej) {
    var s = document.createElement('script');
    s.src = src; s.crossOrigin = 'anonymous';
    s.onload = res;
    s.onerror = function () { rej(new Error('could not load ' + src)); };
    document.head.appendChild(s);
  });
}

var BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
             [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

function onHands(results) {
  hcv.width = 184; hcv.height = 184;
  hctx.clearRect(0, 0, 184, 184);
  var lm = results.multiHandLandmarks && results.multiHandLandmarks[0];
  if (!lm) {
    handX = handY = handZoom = null;
    state.textContent = 'no hand'; state.className = '';
    return;
  }
  state.textContent = 'tracking'; state.className = 'on';

  var tip = lm[8];                              // index fingertip steers
  handX = (0.5 - tip.x) * -2;                   // video is mirrored
  handY = (tip.y - 0.5) * 2;

  var th = lm[4];                               // thumb-to-index distance zooms
  var pinch = Math.hypot(th.x - tip.x, th.y - tip.y);
  handZoom = -2000 + Math.min(1, Math.max(0, (pinch - 0.03) / 0.25)) * 2700;

  hctx.strokeStyle = 'rgba(17,17,17,.72)'; hctx.lineWidth = 1.4;
  BONES.forEach(function (b) {
    hctx.beginPath();
    hctx.moveTo(lm[b[0]].x * 184, lm[b[0]].y * 184);
    hctx.lineTo(lm[b[1]].x * 184, lm[b[1]].y * 184);
    hctx.stroke();
  });
  hctx.fillStyle = '#111';
  [4, 8].forEach(function (k) {
    hctx.beginPath(); hctx.arc(lm[k].x * 184, lm[k].y * 184, 3.4, 0, 7); hctx.fill();
  });
}

camBtn.onclick = function () {
  if (camOn) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    state.textContent = 'no camera api'; return;
  }
  camBtn.textContent = 'starting\u2026';
  var CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/';
  loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js')
    .then(function () { return loadScript(CDN + 'hands.js'); })
    .then(function () {
      var hands = new Hands({ locateFile: function (f) { return CDN + f; } });
      hands.setOptions({ maxNumHands: 1, modelComplexity: 0,
                         minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
      hands.onResults(onHands);
      var cam = new Camera(vid, {
        onFrame: function () { return hands.send({ image: vid }); },
        width: 480, height: 480
      });
      return cam.start();
    })
    .then(function () {
      camOn = true;
      camBtn.textContent = 'hand control on';
      camBtn.className = 'on';
      state.textContent = 'looking for a hand';
    })
    .catch(function (err) {
      camBtn.textContent = 'enable hand control';
      state.textContent = (location.protocol === 'file:')
        ? 'needs a local server' : 'camera blocked';
      console.error(err);
    });
};

/*  Title into caps lines, then size the type to fit.
 *
 *  Tested against all 256 titles, two of which break a naive version: one
 *  Tibetan title is 52 characters with no spaces, and one runs to 23 lines.
 *  So: hard-break over-long tokens, cap the total, and derive the font size
 *  from the longest line and the line count rather than trusting a clamp. */
var MAXCH = 18, MAXLINES = 7;

function capsLines(s) {
  s = s.replace(/\.\s*$/, '').toUpperCase();
  var raw = s.split(/\s+/), words = [];
  raw.forEach(function (w) {                        // break unbreakable tokens
    while (w.length > MAXCH) { words.push(w.slice(0, MAXCH)); w = w.slice(MAXCH); }
    if (w) words.push(w);
  });
  var out = [], line = '';
  for (var i = 0; i < words.length; i++) {
    if ((line + ' ' + words[i]).trim().length > MAXCH) {
      if (line) out.push(line.trim());
      line = words[i];
      if (out.length === MAXLINES - 1) {            // last line, truncate the rest
        var rest = words.slice(i).join(' ');
        out.push(rest.length > MAXCH ? rest.slice(0, MAXCH - 1) + '\u2026' : rest);
        return out;
      }
    } else line += ' ' + words[i];
  }
  if (line.trim()) out.push(line.trim());
  return out;
}

// caps in this face run about .62em wide, so this keeps the longest line
// inside 92vw and the whole block inside 84vh, whichever binds first
function fitSize(lines) {
  var longest = 0;
  lines.forEach(function (l) { longest = Math.max(longest, l.length); });
  return 'min(' + (148 / Math.max(longest, 1)).toFixed(2) + 'vw, ' +
         (84 / lines.length).toFixed(2) + 'vh, 88px)';
}

function openPlate(i) {
  current = i;
  var p = tiles[i].p, num = String(p[0]).padStart(3, '0');

  document.getElementById('pShot').src = thumb(p[3], 1280);
  var lines = capsLines(p[1]).concat(['AETERNUM AGENDA', 'PLATE ' + num]);
  var type = document.getElementById('pType');
  type.style.fontSize = fitSize(lines);
  type.innerHTML = lines.map(function (l) { return '<div>' + l + '</div>'; }).join('');
  document.getElementById('pChapter').textContent = p[2] + '  ' + (CHAPTERS[p[2]] || '');
  document.getElementById('pSrc').innerHTML = p[4].toLowerCase() +
    ' &nbsp;\u00b7&nbsp; <a href="' + p[3] + '" target="_blank" rel="noopener">source</a>';
  document.getElementById('pNumL').textContent = num;
  document.getElementById('pNumR').textContent = num;

  var rules = document.getElementById('pRules');       // hairlines on the type rhythm
  rules.innerHTML = '';
  var n = lines.length + 1;
  for (var k = 1; k < n; k++) {
    var r = document.createElement('i');
    r.style.top = (100 * k / n) + '%';
    rules.appendChild(r);
  }

  var a = document.getElementById('pArcs');            // the book's circle lattice
  a.setAttribute('viewBox', '0 0 1000 600');
  a.innerHTML = '<g fill="none" stroke="#d8d5cd" stroke-width="1">' +
                '<circle cx="500" cy="300" r="430"/>' +
                '<circle cx="500" cy="300" r="215"/>' +
                '<circle cx="500" cy="820" r="560"/></g>';

  pv.classList.add('on');
}

addEventListener('keydown', function (e) {
  if (e.key === 'Escape') pv.classList.remove('on');
  if (!pv.classList.contains('on')) return;
  if (e.key === 'ArrowLeft') stepPlate(-1);
  if (e.key === 'ArrowRight') stepPlate(1);
});

/* ---------------------------------------------------------------- chapters */
var nav = document.getElementById('chapters');
var active = null, counts = {};
PLATES.forEach(function (p) { counts[p[2]] = (counts[p[2]] || 0) + 1; });

function addBtn(key, label, n) {
  var b = document.createElement('button');
  b.innerHTML = label + '<span class="ct">' + (n || '') + '</span>';
  b.dataset.k = key;
  b.setAttribute('aria-pressed', 'false');
  b.onclick = function () {
    active = (key && active !== key) ? key : null;
    tiles.forEach(function (t) {
      t.el.classList.toggle('muted', active !== null && t.p[2] !== active);
    });
    Array.prototype.forEach.call(nav.children, function (c) {
      c.setAttribute('aria-pressed', String(c.dataset.k === (active || '')));
    });
  };
  nav.appendChild(b);
}
addBtn('', 'ALL', N);
Object.keys(CHAPTERS).forEach(function (k) { addBtn(k, k + ' &nbsp;' + CHAPTERS[k], counts[k]); });
nav.firstChild.setAttribute('aria-pressed', 'true');

/* ---------------------------------------------------------------- hud */
var spinBtn = document.getElementById('spin');
spinBtn.onclick = function () {
  spinning = !spinning; if (!spinning) velY = 0;
  spinBtn.textContent = spinning ? 'pause rotation' : 'resume rotation';
};
document.getElementById('reset').onclick = function () {
  rotX = -6; rotY = 0; zoom = -560; velX = 0; velY = spinning ? 0.05 : 0;
};
</script>
